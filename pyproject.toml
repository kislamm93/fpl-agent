[project]
name = "fpl-agent"
version = "0.1.0"
description = "Bedrock AgentCore captaincy & fixtures assistant for an FPL mini-league"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=0.1.0",
    "bedrock-agentcore>=0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["strands-agents-tools"]
# Local dev HTTP server (fpl_agent/serve.py) so the frontend can reach the agent
# before it's deployed to AgentCore Runtime.
serve = ["fastapi>=0.103", "uvicorn>=0.23"]
# Run the agent against a local Ollama instead of Bedrock:
#   pip install -e ".[ollama]"
#   FPL_MODEL_PROVIDER=ollama python -m fpl_agent.main "..."
# Deliberately optional — the deployed image must not carry it.
ollama = ["ollama>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl_agent"]
